[package]
name = "motor_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []
# Native libusb backend for PEAK uCAN adapters (PCAN-USB FD / Pro FD / X6), all channels.
pcan-usb-fd = ["dep:rusb"]

[lib]
name = "motor_core"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
serialport = { version = "4.6", default-features = false }
rusb = { version = "0.9", features = ["vendored"], optional = true }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"
